# App Spec of the "Release Demo" catalog item (type Blueprint -> Helm blueprint "Release Demo",
# form "Release Demo"). Skeleton generated by the UI (Library > Catalog Items > CONFIGURE), then the
# fixed values were replaced with form variables:
#   name              <- App Name (also the Helm release name)
#   environment       <- Environment (code)
#   defaultPool.id    <- Namespace; the option list returns "pool-<id>", the App Spec needs the id
#   templateParameter <- Helm values file passed with -f; only the keys the form sets are listed,
#                        everything else comes from the chart's values.yaml
id: 5
templateId: 5
type: helm
name: <%= customOptions.appName %>
description: 'Release Demo: http://apps.hpetrlab.local:<%= customOptions.nodePort %>'
category: kubernetes
helm:
  git:
    repoId: 1
    path: release-demo-chart
    integrationId: 3
    branch: main
  configType: git
needsReset: true
group:
  id: 1
  code: all-clouds
environment: <%= customOptions.environment %>
defaultPool:
  id: <%= customOptions.namespace.toString().replace('pool-', '') %>
hideSetVariables: true
templateParameter:
  values: |
    replicaCount: <%= customOptions.replicas %>
    service:
      nodePort: <%= customOptions.nodePort %>
lock:
  templateParameter:
    values: 'on'
