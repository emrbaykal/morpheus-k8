# Spec Template: k8-web-deployment
# PHP/nginx pods; replicas from the catalog form.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <%= customOptions.appName %>
  labels:
    app: <%= customOptions.appName %>
spec:
  replicas: <%= customOptions.replicas %>
  selector:
    matchLabels:
      app: <%= customOptions.appName %>
  template:
    metadata:
      labels:
        app: <%= customOptions.appName %>
    spec:
      volumes:
        - name: web-content
          configMap:
            name: <%= customOptions.appName %>-config
      containers:
        - name: web
          image: webdevops/php-nginx:8.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: web-content
              mountPath: /app/index.php
              subPath: index.php
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
