# Spec Template: k8-web-service
# NodePort from the catalog form; published by the morpheus-lb HAProxy at
# http://apps.hpetrlab.local:<nodePort>.
apiVersion: v1
kind: Service
metadata:
  name: <%= customOptions.appName %>
  labels:
    app: <%= customOptions.appName %>
spec:
  type: NodePort
  selector:
    app: <%= customOptions.appName %>
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: <%= customOptions.nodePort %>
      protocol: TCP
