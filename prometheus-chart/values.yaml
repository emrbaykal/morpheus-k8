image:
  repository: quay.io/prometheus/prometheus
  tag: v3.5.0

service:
  type: NodePort
  nodePort: 31390

# Days of data Prometheus keeps.
retentionDays: 30

persistence:
  enabled: true
  storageClassName: ""
  size: 10Gi

resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 1Gi}

scrapeInterval: 30s

# Optional: read Morpheus (or a VM Essentials manager) through its REST API and keep
# per-server CPU, memory, storage, network and IOPS as time series. Only the samples
# written by the Morpheus agent are exported, so a hypervisor-only sample leaves a gap
# instead of a zero; use last_over_time() in Grafana to bridge it.
morpheusScrape:
  enabled: false
  # Base URL of the Morpheus appliance, e.g. https://morpheus.example.com
  url: ""
  # API token of a read-only Morpheus user (Compute = Read is enough for /api/servers).
  token: ""
  insecureSkipVerify: true
  # Label that tells several Morpheus sources apart in Prometheus.
  name: morpheus
  # /api/servers keeps one latest sample per server; the agent sample is overwritten by the
  # hypervisor poll within seconds to about 20 s. With both on a 60 s cycle a 30 s scrape can
  # miss a server every time, so this job is scraped more often than the rest.
  interval: 15s
  # Must be shorter than interval. One read of /api/servers?max=2000 took about 4 s in the lab.
  timeout: 12s
  image:
    repository: quay.io/prometheuscommunity/json-exporter
    tag: v0.7.0
