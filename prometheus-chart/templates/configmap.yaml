apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prom.name" . }}
  labels:
    {{- include "prom.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      scrape_timeout: 25s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      {{- if .Values.morpheusScrape.enabled }}
      - job_name: morpheus
        metrics_path: /probe
        params:
          module: [morpheus]
          target: [{{ printf "%s/api/servers?max=2000" (trimSuffix "/" .Values.morpheusScrape.url) | quote }}]
        static_configs:
          - targets: [{{ printf "%s-json-exporter:7979" (include "prom.name" .) | quote }}]
            labels:
              morpheus: {{ .Values.morpheusScrape.name | quote }}
      {{- end }}
