apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prom.name" . }}
  labels:
    {{- include "prom.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      scrape_timeout: 25s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      {{- $hosts := list }}
      {{- range (splitList "," (.Values.hostScrape.hosts | default "")) }}
      {{- if trim . }}{{ $hosts = append $hosts (trim .) }}{{ end }}
      {{- end }}
      {{- if $hosts }}
      {{- range $job := list (dict "name" "node" "port" .Values.hostScrape.nodeExporterPort) (dict "name" "libvirt" "port" .Values.hostScrape.libvirtExporterPort) }}
      - job_name: {{ $job.name }}
        static_configs:
          - targets: [{{ range $i, $h := $hosts }}{{ if $i }}, {{ end }}{{ printf "%s:%v" $h $job.port | quote }}{{ end }}]
            labels:
              # the HVM dashboards only show series with this label
              source: {{ $.Values.hostScrape.source | default "hvm" | quote }}
        relabel_configs:
          # instance = host address without the port, so node and libvirt metrics of one
          # host share the same instance value
          - source_labels: [__address__]
            regex: '(.+):\d+'
            target_label: instance
      {{- end }}
      {{- end }}
      {{- if .Values.morpheusScrape.enabled }}
      - job_name: morpheus
        scrape_interval: {{ .Values.morpheusScrape.interval | default "15s" }}
        scrape_timeout: {{ .Values.morpheusScrape.timeout | default "12s" }}
        metrics_path: /probe
        params:
          module: [morpheus]
          target: [{{ printf "%s/api/servers?max=2000" (trimSuffix "/" .Values.morpheusScrape.url) | quote }}]
        static_configs:
          - targets: [{{ printf "%s-json-exporter:7979" (include "prom.name" .) | quote }}]
            labels:
              morpheus: {{ .Values.morpheusScrape.name | quote }}
      {{- end }}
