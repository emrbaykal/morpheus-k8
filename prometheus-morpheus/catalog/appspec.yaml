# App Spec of the "Prometheus" catalog item (type Blueprint -> Helm blueprint "Prometheus", form "Prometheus").
# The chart is prometheus-chart/ in this repository; the form sets its values:
#   service         NodePort from the form, reached at http://<Public Address>:<nodePort>
#   persistence     PVC on the StorageClass and size chosen in the form
#   retentionDays   how long Prometheus keeps data
#   morpheusScrape  optional json-exporter that reads /api/servers of a Morpheus / VM Essentials
#                   manager with a read-only token (the token is also stored in the order)
# Namespace: defaultPool.id - the namespace option list returns "pool-<id>", the App Spec needs the id.
# BLUEPRINT_ID is filled in when the blueprint is created.
id: BLUEPRINT_ID
templateId: BLUEPRINT_ID
type: helm
name: <%= customOptions.appName %>
description: 'Prometheus: http://<%= customOptions.publicHost %>:<%= customOptions.nodePort %>'
category: monitoring
helm:
  git:
    repoId: 1
    path: prometheus-chart
    integrationId: 3
    branch: main
  configType: git
needsReset: true
group:
  id: <%= customOptions.group %>
environment: <%= customOptions.environment %>
defaultPool:
  id: <%= customOptions.namespace.toString().replace('pool-', '') %>
hideSetVariables: true
templateParameter:
  values: |
    service:
      type: NodePort
      nodePort: <%= customOptions.nodePort %>
    retentionDays: <%= customOptions.retentionDays %>
    persistence:
      enabled: true
      storageClassName: <%= customOptions.storageClass %>
      size: <%= customOptions.storageSize %>Gi
    morpheusScrape:
      enabled: <%= customOptions.morpheusScrape?.toString() in ['on', 'true'] %>
      url: '<%= customOptions.morpheusUrl ?: '' %>'
      token: '<%= customOptions.morpheusToken ?: '' %>'
      name: '<%= customOptions.morpheusName ?: 'morpheus' %>'
lock:
  templateParameter:
    values: 'on'
